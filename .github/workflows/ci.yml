name: ci

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  # The Nx Go plugin needs a `go` on PATH; the shim forwards to a container so
  # the runner never installs a Go toolchain.
  NX_GO_SHIM: ${{ github.workspace }}/scripts/bin
  # Belt-and-suspenders alongside nx.json's own "analytics": false and
  # "neverConnectToCloud": true - no vendor here should receive a usage
  # ping from a CI run of this prototype.
  NX_NO_CLOUD: "true"
  NG_CLI_ANALYTICS: "false"

jobs:
  affected:
    name: nx affected
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - run: npm ci --no-audit --no-fund

      - name: Derive the SHAs for nx affected
        uses: nrwl/nx-set-shas@v4

      - name: Lint, test and build affected projects
        run: |
          export PATH="${NX_GO_SHIM}:${PATH}"
          npx nx affected --target=lint --parallel=3
          npx nx affected --target=test --parallel=3
          npx nx affected --target=build --parallel=3

      - name: An Angular change must not rebuild the Go service
        run: bash scripts/tests/nx-affected-isolation.sh

  policy:
    name: cerbos policy suite
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # Fails fast if the committed catalog (policies, schemas, tests, DB
      # seed) has drifted from libs/cataloggen/manifest.yaml, without waiting
      # for the full Cerbos compile below (issue #8, §21).
      - name: The generated catalog matches the manifest
        run: make catalog-check

      # Fails the build on any UI capability catalog drift or validation
      # violation: an empty allOf/anyOf, an unknown resource or action, a
      # circular capability reference, or a negation construct (issue #10).
      - name: The UI capability catalog matches the generator and validates
        run: make capability-check

      # The policy suite is the authoritative statement of the precedence rules,
      # so it runs on every commit rather than only when Nx thinks it is
      # affected. It needs no Node, no Go and no running stack.
      #
      # Not yet sharded: at full catalog scale (~155 resources) this step
      # takes well under a minute, so a single job is still fast feedback.
      # The wall-clock time is recorded below so a future regression, or
      # catalog growth that changes that, is visible before it needs
      # sharding.
      - name: Compile the policies and run the precedence matrix
        run: |
          start="$(date +%s)"
          make policy-test
          duration=$(( $(date +%s) - start ))
          echo "cerbos policy suite: ${duration}s wall clock" | tee -a "${GITHUB_STEP_SUMMARY}"

  # The migration and store contracts against the default engine. Fast enough to
  # run on every push, unlike the Oracle half below.
  database:
    name: authorization schema on postgres
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Start PostgreSQL
        run: |
          cp .env.example .env
          docker compose up --detach postgres
          bash scripts/compose-wait.sh postgres

      - name: The changelog set applies, twice, and is portable by construction
        run: bash scripts/tests/migration-contract.sh postgres

      - name: The store contract holds on PostgreSQL
        run: bash scripts/tests/store-contract.sh postgres

      - name: Database logs
        if: failure()
        run: docker compose logs --no-color postgres

      - name: Tear everything down
        if: always()
        run: make clean

  # Does this change touch the schema or the store?
  #
  # The Oracle job is expensive, so it should not run on an Angular-only change.
  # Deciding that from the diff rather than from a label matters: a label is a
  # step someone has to remember, and the one time it is forgotten is the time
  # the portability claim goes unverified.
  changes:
    name: what changed
    runs-on: ubuntu-latest
    outputs:
      database: ${{ steps.filter.outputs.database }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - id: filter
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: |
          base="${BASE_SHA:-HEAD~1}"
          if ! git cat-file -e "${base}" 2>/dev/null; then
            echo "database=true" >> "${GITHUB_OUTPUT}"
            echo "cannot resolve ${base}; assuming the database changed"
            exit 0
          fi

          if git diff --name-only "${base}" HEAD | grep -qE \
              '^(deploy/liquibase/|libs/assignmentstore/|scripts/liquibase\.sh|scripts/oracle-wait\.sh|scripts/tests/(migration|store)-contract\.sh|docker-compose\.yml|\.github/workflows/ci\.yml)'; then
            echo "database=true" >> "${GITHUB_OUTPUT}"
          else
            echo "database=false" >> "${GITHUB_OUTPUT}"
          fi
          echo "changed files:"
          git diff --name-only "${base}" HEAD

  # Portability is proven by execution: the same changelog set and the same
  # assertions against Oracle as against PostgreSQL.
  #
  # Oracle 23ai Free is a large image and slow to start, so this runs when the
  # schema or the store changed, and on every push to main regardless. The PRD's
  # risk register accepts that this is the slowest job in CI.
  dual-dialect:
    name: dual dialect portability
    runs-on: ubuntu-latest
    needs: changes
    if: needs.changes.outputs.database == 'true' || github.event_name == 'push'
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - name: Start both engines
        run: |
          cp .env.example .env
          docker compose up --detach postgres
          docker compose --profile oracle up --detach oracle
          bash scripts/compose-wait.sh postgres

      - name: Wait for Oracle to create its pluggable database
        run: bash scripts/oracle-wait.sh

      - name: The same changelog set applies to PostgreSQL
        run: bash scripts/tests/migration-contract.sh postgres

      - name: The same changelog set applies to Oracle
        run: bash scripts/tests/migration-contract.sh oracle

      # REQUIRE_ENGINES makes a skipped engine a failure, so this step cannot
      # pass by quietly not running.
      - name: One contract suite, both engines
        run: bash scripts/tests/store-contract.sh dual

      - name: Database logs
        if: failure()
        run: docker compose --profile oracle logs --no-color

      - name: Tear everything down
        if: always()
        run: make clean

  compose:
    name: docker compose walking skeleton
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install the compose contract test dependencies
        run: pip install --quiet pyyaml

      - name: Compose topology contract
        run: python3 scripts/tests/compose-contract.py

      - name: Start the control plane
        run: |
          cp .env.example .env
          make up

      # make smoke also runs the end-to-end decision test, which drives real
      # authorization decisions through the ADS into a real PDP. The policy suite
      # proves the rules; this proves the wiring that carries them.
      - name: Smoke the running stack and its decisions
        run: make smoke

      - name: Container logs
        if: failure()
        run: docker compose logs --no-color

      - name: Tear everything down
        if: always()
        run: make clean

  # The §18 chaos scenario suite (issue #26) stands up its own kind cluster,
  # separate from the docker-compose skeleton every job above exercises, so
  # it only runs on a real merge to main rather than on every pull request -
  # it is slow (a from-scratch cluster, KEDA and metrics-server install, and
  # every service image built and loaded) and its failure signal matters most
  # exactly where the §18 table's guarantees have to keep holding: what is
  # about to stay deployed.
  chaos:
    name: chaos scenario suite
    runs-on: ubuntu-latest
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - name: Run the chaos suite against a real kind cluster
        run: make chaos
