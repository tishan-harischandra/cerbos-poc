@if (auth.claims(); as claims) {
  <header class="app-header" data-testid="app-header">
    <span data-testid="active-hospital">{{ claims.tenantId }} / {{ claims.hospitalId }}</span>
    @if (claims.otherHospitals.length) {
      <select (change)="onSwitchHospital($event)" data-testid="hospital-switcher">
        <option value="" selected disabled>Switch hospital&hellip;</option>
        @for (hospital of claims.otherHospitals; track hospital) {
          <option [value]="hospital" [attr.data-testid]="'hospital-option-' + hospital">
            {{ hospital }}
          </option>
        }
      </select>
    }
  </header>
}
<router-outlet></router-outlet>
