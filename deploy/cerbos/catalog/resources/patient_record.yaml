# Hand-authored to match the hand-authored patient_record policy (ADR-006
# reference pattern, deploy/cerbos/policies/resources/patient_record.yaml).
# Every other file in this directory is generated by libs/cataloggen from
# libs/cataloggen/manifest.yaml; this one exists so patient_record is still
# browsable in the administration-facing catalog (PRD story 10) and so the
# catalog-policy drift check in tests/architecture has something to compare
# patient_record's policy against.
resource: patient_record
version: v1
displayName: Patient record
domain: clinical
fhirType: Patient
actions:
  - key: list
    displayName: List patients
    context: COLLECTION
    risk: STANDARD
  - key: read
    displayName: View patient
    context: INSTANCE
    risk: STANDARD
  - key: update
    displayName: Update patient
    context: INSTANCE
    risk: ELEVATED
  - key: delete
    displayName: Delete patient
    context: INSTANCE
    risk: ELEVATED
