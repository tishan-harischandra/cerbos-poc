server:
  httpListenAddr: ":3592"
  grpcListenAddr: ":3593"

storage:
  driver: disk
  disk:
    directory: /policies
    watchForChanges: true

schema:
  # `cerbos compile` validates schemas while running policy tests, so without
  # this the served PDP would be more permissive than the suite that proves it:
  # a request missing permissionContext would only warn instead of being
  # rejected ([R10]).
  enforcement: reject

audit:
  enabled: false

# Cerbos phones home an anonymous usage beacon by default; this prototype
# runs entirely inside the user's own compose network and has no vendor
# relationship with Cerbos that needs that telemetry.
telemetry:
  disabled: true
