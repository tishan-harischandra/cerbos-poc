server:
  httpListenAddr: ":3592"
  grpcListenAddr: ":3593"
  # The Admin API backs the policy controller's explicit store reload
  # (§13.2, issue #21). It is optional and currently basic-auth-only [R7], so
  # it must never be exposed through ingress (§14.4): the port it shares
  # with the runtime gRPC service is never published to the host in
  # docker-compose.yml, and the only caller is the policy-controller
  # container on the same internal network.
  adminAPI:
    enabled: true
    adminCredentials:
      # bcrypt hash of "change-me", the same default password used
      # elsewhere in this compose topology (POSTGRES_PASSWORD,
      # KEYCLOAK_ADMIN_PASSWORD): this is a dev environment inside the
      # operator's own compose network, never exposed through ingress
      # (§14.4). The policy-controller's CERBOS_ADMIN_PASSWORD default
      # (apps/policy-controller/internal/config) is the plaintext this
      # hashes.
      username: cerbos
      passwordHash: "$2a$10$uCc9EMxPZl7zmK0ZAts6Eej2HI.zTv0oOsTXxzyG8bF9QjX1BaUeC"

storage:
  driver: disk
  disk:
    directory: /policies
    watchForChanges: true

schema:
  # `cerbos compile` validates schemas while running policy tests, so without
  # this the served PDP would be more permissive than the suite that proves it:
  # a request missing permissionContext would only warn instead of being
  # rejected ([R10]).
  enforcement: reject

audit:
  enabled: false

# Cerbos phones home an anonymous usage beacon by default; this prototype
# runs entirely inside the user's own compose network and has no vendor
# relationship with Cerbos that needs that telemetry.
telemetry:
  disabled: true
