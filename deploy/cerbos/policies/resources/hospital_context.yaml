---
# Root resource policy for hospital_context (ADR-006: one file per resource).
#
# hospital_context is the tenant/hospital scoping check the §12.1 composite
# UI capabilities reuse across the board (every X.route.list capability
# requires it, issue #10). It carries no clinical data, only the isolation
# and permission-context attributes any capability leaf needs, so it exposes
# exactly one action: read.
#
# Every rule binds to the single synthetic role `sys:permission-evaluator`
# (§6.4, ADR-003), mirroring patient_record.yaml so a user revoke still beats
# a role grant deterministically.
apiVersion: api.cerbos.dev/v1
resourcePolicy:
  resource: hospital_context
  version: v1

  variables:
    local:
      isolated: >-
        request.principal.attr.tenantId == request.resource.attr.tenantId &&
        request.principal.attr.hospitalId == request.resource.attr.hospitalId
      role_actions: request.resource.attr.permissionContext.roleGrantedActions
      user_grants: request.resource.attr.permissionContext.userGrantedActions
      user_revokes: request.resource.attr.permissionContext.userRevokedActions

  rules:
    - name: tenant_and_hospital_isolation
      actions: ["*"]
      effect: EFFECT_DENY
      roles: ["sys:permission-evaluator"]
      condition:
        match:
          expr: "!variables.isolated"
      output:
        when:
          ruleActivated: '"fired"'

    - name: revoke_read
      actions: ["read"]
      effect: EFFECT_DENY
      roles: ["sys:permission-evaluator"]
      condition:
        match:
          expr: '"read" in variables.user_revokes'
      output:
        when:
          ruleActivated: '"fired"'

    - name: grant_read_to_user
      actions: ["read"]
      effect: EFFECT_ALLOW
      roles: ["sys:permission-evaluator"]
      condition:
        match:
          expr: '"read" in variables.user_grants'
      output:
        when:
          ruleActivated: '"fired"'

    - name: grant_read_to_role
      actions: ["read"]
      effect: EFFECT_ALLOW
      roles: ["sys:permission-evaluator"]
      condition:
        match:
          expr: '"read" in variables.role_actions'
      output:
        when:
          ruleActivated: '"fired"'

  schemas:
    principalSchema:
      ref: cerbos:///principal.json
    resourceSchema:
      ref: cerbos:///hospital_context.json
