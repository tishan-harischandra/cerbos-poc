---
# Root resource policy for patient_record (ADR-006: one file per resource).
#
# Every rule binds to the single synthetic role `sys:permission-evaluator`
# (§6.4, ADR-003). That is the whole point: Cerbos resolves deny-over-allow
# within a role but lets an allow from one role defeat a deny from another, so
# funnelling every rule through one role is what makes
#
#     mandatory deny > user REVOKE > user GRANT > role grant > default deny
#
# deterministic. The ADS supplies the three action sets as resource data and
# never decides anything itself (§6.3, §21).
apiVersion: api.cerbos.dev/v1
resourcePolicy:
  resource: patient_record
  version: v1

  variables:
    local:
      # issue #81: an empty hospital (a tenant-wide administrator session,
      # issue #80) satisfies isolation against any hospital in the same
      # tenant, because role_permission - what role_actions comes from -
      # carries no hospital dimension at all (§8.1): a role means the same
      # thing across the whole tenant, and tenant-wide is exactly "the
      # tenant's own role grants, no single hospital". hospital_scoped is
      # the opposite fact, used below to keep the directional half of the
      # invariant explicit at the one place it could otherwise leak: a
      # user grant is a hospital-narrowed assignment by construction
      # (§8.1 gives user_permission_override a hospital_id column
      # role_permission does not), so it must never apply to a session
      # with no hospital, however isolated that session's tenant
      # isolation check reads.
      isolated: >-
        request.principal.attr.tenantId == request.resource.attr.tenantId &&
        (request.principal.attr.hospitalId == "" ||
         request.principal.attr.hospitalId == request.resource.attr.hospitalId)
      hospital_scoped: request.principal.attr.hospitalId != ""
      role_actions: request.resource.attr.permissionContext.roleGrantedActions
      user_grants: request.resource.attr.permissionContext.userGrantedActions
      user_revokes: request.resource.attr.permissionContext.userRevokedActions
      is_locked: request.resource.attr.status == "LOCKED"

  rules:
    # Mandatory restrictions first. They are explicit denies rather than
    # conditions on the allow rules so that no grant can bypass them and no
    # future allow rule can forget them: within this one role, deny always wins.

    # Isolation applies to every action, including ones added later, which is
    # why it uses the wildcard rather than a list to keep in step.
    - name: tenant_and_hospital_isolation
      actions: ["*"]
      effect: EFFECT_DENY
      roles: ["sys:permission-evaluator"]
      condition:
        match:
          expr: "!variables.isolated"
      output:
        when:
          ruleActivated: '"fired"'

    - name: locked_record_restriction
      actions: ["update", "delete"]
      effect: EFFECT_DENY
      roles: ["sys:permission-evaluator"]
      condition:
        match:
          expr: variables.is_locked
      output:
        when:
          ruleActivated: '"fired"'

    # User revocations outrank every grant below.
    #
    # These are one rule per action because a Cerbos condition cannot name the
    # action being evaluated: there is no `request.action` in the CEL context, so
    # the action has to be a literal. That is the repetition the policy generator
    # exists to remove (§8); when a new action is added, every block below needs a
    # sibling, and the §19.1 matrix is what catches a missing one.
    - name: revoke_list
      actions: ["list"]
      effect: EFFECT_DENY
      roles: ["sys:permission-evaluator"]
      condition:
        match:
          expr: '"list" in variables.user_revokes'
      output:
        when:
          ruleActivated: '"fired"'

    - name: revoke_read
      actions: ["read"]
      effect: EFFECT_DENY
      roles: ["sys:permission-evaluator"]
      condition:
        match:
          expr: '"read" in variables.user_revokes'
      output:
        when:
          ruleActivated: '"fired"'

    - name: revoke_update
      actions: ["update"]
      effect: EFFECT_DENY
      roles: ["sys:permission-evaluator"]
      condition:
        match:
          expr: '"update" in variables.user_revokes'
      output:
        when:
          ruleActivated: '"fired"'

    - name: revoke_delete
      actions: ["delete"]
      effect: EFFECT_DENY
      roles: ["sys:permission-evaluator"]
      condition:
        match:
          expr: '"delete" in variables.user_revokes'
      output:
        when:
          ruleActivated: '"fired"'

    # User grants. Kept separate from role grants so the audit trail records
    # which source of authority allowed the action. Isolation is not repeated
    # here: the mandatory deny above already covers every action. The
    # variables.hospital_scoped conjunct is issue #81's directional
    # invariant, defense in depth at the layer that decides: a user grant
    # is a hospital-narrowed assignment, so it must never apply to a
    # tenant-wide session, even though the assignment service's own query
    # for one already returns nothing to grant.
    - name: grant_list_to_user
      actions: ["list"]
      effect: EFFECT_ALLOW
      roles: ["sys:permission-evaluator"]
      condition:
        match:
          expr: '"list" in variables.user_grants && variables.hospital_scoped'
      output:
        when:
          ruleActivated: '"fired"'

    - name: grant_read_to_user
      actions: ["read"]
      effect: EFFECT_ALLOW
      roles: ["sys:permission-evaluator"]
      condition:
        match:
          expr: '"read" in variables.user_grants && variables.hospital_scoped'
      output:
        when:
          ruleActivated: '"fired"'

    - name: grant_update_to_user
      actions: ["update"]
      effect: EFFECT_ALLOW
      roles: ["sys:permission-evaluator"]
      condition:
        match:
          expr: '"update" in variables.user_grants && variables.hospital_scoped'
      output:
        when:
          ruleActivated: '"fired"'

    - name: grant_delete_to_user
      actions: ["delete"]
      effect: EFFECT_ALLOW
      roles: ["sys:permission-evaluator"]
      condition:
        match:
          expr: '"delete" in variables.user_grants && variables.hospital_scoped'
      output:
        when:
          ruleActivated: '"fired"'

    # Role grants, the default source of business capability.
    - name: grant_list_to_role
      actions: ["list"]
      effect: EFFECT_ALLOW
      roles: ["sys:permission-evaluator"]
      condition:
        match:
          expr: '"list" in variables.role_actions'
      output:
        when:
          ruleActivated: '"fired"'

    - name: grant_read_to_role
      actions: ["read"]
      effect: EFFECT_ALLOW
      roles: ["sys:permission-evaluator"]
      condition:
        match:
          expr: '"read" in variables.role_actions'
      output:
        when:
          ruleActivated: '"fired"'

    - name: grant_update_to_role
      actions: ["update"]
      effect: EFFECT_ALLOW
      roles: ["sys:permission-evaluator"]
      condition:
        match:
          expr: '"update" in variables.role_actions'
      output:
        when:
          ruleActivated: '"fired"'

    - name: grant_delete_to_role
      actions: ["delete"]
      effect: EFFECT_ALLOW
      roles: ["sys:permission-evaluator"]
      condition:
        match:
          expr: '"delete" in variables.role_actions'
      output:
        when:
          ruleActivated: '"fired"'

  schemas:
    principalSchema:
      ref: cerbos:///principal.json
    resourceSchema:
      ref: cerbos:///patient_record.json
