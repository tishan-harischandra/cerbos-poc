apiVersion: apps/v1
kind: Deployment
metadata:
  name: admin-service
spec:
  replicas: 2
  selector:
    matchLabels:
      app: admin-service
  template:
    metadata:
      labels:
        app: admin-service
    spec:
      # Only the leader drains the outbox (ADR-009), and under K8S_LEASE the
      # election is a Lease object this ServiceAccount is allowed to hold.
      serviceAccountName: leader-elector
      # See deploy/k8s/base/ads/deployment.yaml's comment: this copies the
      # committed authorization catalog (resources) and capability catalog
      # (ui-capabilities) the same way, since admin-service reads both
      # (§9.1's impact preview and capability impact endpoints).
      initContainers:
        - name: assets
          image: cerbos-poc/cerbos-assets:dev
          command:
            - /bin/sh
            - -c
            - |
              cp -r /assets/catalog/resources/* /authorization-catalog/
              cp -r /assets/catalog/ui-capabilities/* /capability-catalog/
          volumeMounts:
            - name: authorization-catalog
              mountPath: /authorization-catalog
            - name: capability-catalog
              mountPath: /capability-catalog
      containers:
        - name: admin-service
          image: cerbos-poc/admin-service:dev
          envFrom:
            - configMapRef:
                name: admin-service-config
            - configMapRef:
                name: idp-config
            - configMapRef:
                name: leader-election-config
            - secretRef:
                name: postgres-dsn
          env:
            # The pod name, so `kubectl get lease` names the replica that
            # holds the election rather than an opaque identifier.
            - name: LEADER_ELECTION_IDENTITY
              valueFrom:
                fieldRef:
                  fieldPath: metadata.name
          volumeMounts:
            - name: authorization-catalog
              mountPath: /authorization-catalog
              readOnly: true
            - name: capability-catalog
              mountPath: /capability-catalog
              readOnly: true
            - name: idp-admin-credentials
              mountPath: /run/secrets/idp-admin-credentials
              subPath: idp-admin-credentials
              readOnly: true
            - name: idp-admin-credentials-tenant-b
              mountPath: /run/secrets/idp-admin-credentials-tenant-b
              subPath: idp-admin-credentials-tenant-b
              readOnly: true
            - name: policy-release-archives
              mountPath: /var/lib/policy-controller/archives
              readOnly: true
          ports:
            - name: http
              containerPort: 8081
          readinessProbe:
            httpGet:
              path: /readyz
              port: http
            initialDelaySeconds: 5
            periodSeconds: 5
            failureThreshold: 20
          livenessProbe:
            httpGet:
              path: /readyz
              port: http
            initialDelaySeconds: 10
            periodSeconds: 10
            failureThreshold: 6
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              cpu: 500m
              memory: 512Mi
      volumes:
        - name: authorization-catalog
          emptyDir: {}
        - name: capability-catalog
          emptyDir: {}
        - name: idp-admin-credentials
          secret:
            secretName: idp-admin-credentials
        - name: idp-admin-credentials-tenant-b
          secret:
            secretName: idp-admin-credentials-tenant-b
        # Empty until the (out-of-scope-for-this-slice) policy-controller
        # ever runs; admin-service's revision module already handles that
        # by reporting no current revision rather than erroring (see
        # docker-compose.yml's admin-service comment).
        - name: policy-release-archives
          emptyDir: {}
