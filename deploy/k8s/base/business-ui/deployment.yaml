apiVersion: apps/v1
kind: Deployment
metadata:
  name: business-ui
spec:
  replicas: 2
  selector:
    matchLabels:
      app: business-ui
  template:
    metadata:
      labels:
        app: business-ui
    spec:
      containers:
        - name: business-ui
          image: cerbos-poc/business-ui:dev
          ports:
            - name: http
              containerPort: 80
          readinessProbe:
            httpGet:
              path: /index.html
              port: http
            initialDelaySeconds: 5
            periodSeconds: 5
            failureThreshold: 20
          livenessProbe:
            httpGet:
              path: /index.html
              port: http
            initialDelaySeconds: 10
            periodSeconds: 10
            failureThreshold: 6
          resources:
            requests:
              cpu: 50m
              memory: 64Mi
            limits:
              cpu: 250m
              memory: 256Mi
