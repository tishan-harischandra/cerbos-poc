# Shared configuration every Go service (ads, admin-service,
# resource-service) needs: the §7.1 IdP adapter selection and the
# assignmentstore Postgres DSN. Centralised here so an overlay only has to
# patch one place to point every service at a different IdP adapter or
# database, instead of three copies drifting apart.
#
# Who the tenant is - realm, issuer, client, service account secret - is
# not here: it comes from the tenant registry (issue #76,
# deploy/tenant-registry.yaml, seeded by scripts/seed-tenants.sh) instead
# of IDP_REALM/IDP_TENANT_ID/IDP_ISSUER/IDP_CLIENT_ID/
# IDP_SERVICE_CLIENT_ID/IDP_CREDENTIALS_SECRET_REF, and every realm the
# registry names is served by this same set of workloads (issue #77): there
# is no installation-wide tenant mapping mode either, since every realm
# derives its own tenant from itself.
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
  - ingress.yaml
configMapGenerator:
  - name: idp-config
    literals:
      - IDP_TYPE=KEYCLOAK
      - IDP_BASE_URL=http://keycloak:8080
      - IDP_ADDR=keycloak:8080
      - IDP_ROLE_SOURCE=REALM
  # Which mechanism elects the singleton workloads (ADR-009). K8S_LEASE is
  # the natural choice here: the control plane already keeps Leases
  # available, an operator can read the election with kubectl, and the
  # database is left out of a decision that has nothing to do with data.
  # There is deliberately no default in the code - an unset value refuses to
  # start, because the failure it would otherwise cause is silent.
  - name: leader-election-config
    literals:
      - LEADER_ELECTION_TYPE=K8S_LEASE
      - LEADER_ELECTION_TTL=15s
      # A third of the ttl, so two consecutive renewals can fail before
      # leadership is genuinely at risk.
      - LEADER_ELECTION_RENEW_INTERVAL=5s
      - LEADER_ELECTION_RETRY_INTERVAL=2s
secretGenerator:
  - name: idp-admin-credentials
    files:
      - idp-admin-credentials=../../../secrets/idp-admin-credentials
  # tenant-b's own service-account credential (issue #77): a second,
  # genuinely registered realm needs a secret distinct from tenant-a's, not
  # a reused one.
  - name: idp-admin-credentials-tenant-b
    files:
      - idp-admin-credentials-tenant-b=../../../secrets/idp-admin-credentials-tenant-b
  # The dev-only fixture credential compose defaults every DSN to
  # (POSTGRES_PASSWORD=change-me). A real deployment overlay would source
  # this from a cluster secret manager instead of a literal here.
  - name: postgres-dsn
    literals:
      - ASSIGNMENTSTORE_POSTGRES_DSN=postgres://cerbos_poc:change-me@postgres:5432/cerbos_poc?sslmode=disable
generatorOptions:
  disableNameSuffixHash: true
