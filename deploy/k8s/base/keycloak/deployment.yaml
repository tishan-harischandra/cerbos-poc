# Same start-dev, in-memory-store configuration docker-compose's default
# `keycloak` service runs (see docker-compose.yml's comment on that
# service): fine for the demo fixture realm, not horizontally scalable, so
# this stays a single-replica Deployment with no ScaledObject, matching
# postgres/redpanda.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: keycloak
spec:
  replicas: 1
  selector:
    matchLabels:
      app: keycloak
  template:
    metadata:
      labels:
        app: keycloak
    spec:
      containers:
        - name: keycloak
          # The organization selector authenticator (issue #79) is baked
          # into this image at build time (apps/keycloak-org-selector/
          # Dockerfile), the same custom image docker-compose.yml builds.
          image: cerbos-poc/keycloak:dev
          # `organization` is a preview feature in 26.4: Keycloak Organizations
          # (issue #75/#78) is disabled by default and every organization
          # import 400s without it, matching docker-compose.yml's keycloak
          # service.
          args: ["start-dev", "--import-realm", "--features=organization"]
          envFrom:
            - secretRef:
                name: keycloak-credentials
          env:
            - name: KC_HOSTNAME
              value: "http://localhost:8081"
            - name: KC_HTTP_ENABLED
              value: "true"
            - name: KC_HTTP_PORT
              value: "8080"
            - name: KC_HOSTNAME_BACKCHANNEL_DYNAMIC
              value: "true"
            - name: KC_HEALTH_ENABLED
              value: "true"
          ports:
            - name: http
              containerPort: 8080
            - name: management
              containerPort: 9000
          volumeMounts:
            - name: realm-import
              mountPath: /opt/keycloak/data/import
              readOnly: true
          readinessProbe:
            httpGet:
              path: /health/ready
              port: management
            initialDelaySeconds: 20
            periodSeconds: 5
            failureThreshold: 40
          livenessProbe:
            httpGet:
              path: /health/live
              port: management
            initialDelaySeconds: 30
            periodSeconds: 10
            failureThreshold: 6
          resources:
            requests:
              cpu: 250m
              memory: 512Mi
            limits:
              cpu: "1"
              memory: 1Gi
      volumes:
        - name: realm-import
          configMap:
            name: keycloak-realms
