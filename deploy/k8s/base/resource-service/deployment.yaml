apiVersion: apps/v1
kind: Deployment
metadata:
  name: resource-service
spec:
  replicas: 2
  selector:
    matchLabels:
      app: resource-service
  template:
    metadata:
      labels:
        app: resource-service
    spec:
      containers:
        - name: resource-service
          image: cerbos-poc/resource-service:dev
          envFrom:
            - configMapRef:
                name: resource-service-config
            - configMapRef:
                name: idp-config
            - secretRef:
                name: postgres-dsn
          volumeMounts:
            - name: idp-admin-credentials
              mountPath: /run/secrets/idp-admin-credentials
              subPath: idp-admin-credentials
              readOnly: true
            - name: idp-admin-credentials-tenant-b
              mountPath: /run/secrets/idp-admin-credentials-tenant-b
              subPath: idp-admin-credentials-tenant-b
              readOnly: true
          ports:
            - name: http
              containerPort: 8080
          readinessProbe:
            httpGet:
              path: /readyz
              port: http
            initialDelaySeconds: 5
            periodSeconds: 5
            failureThreshold: 20
          livenessProbe:
            httpGet:
              path: /readyz
              port: http
            initialDelaySeconds: 10
            periodSeconds: 10
            failureThreshold: 6
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              cpu: 500m
              memory: 512Mi
      volumes:
        - name: idp-admin-credentials
          secret:
            secretName: idp-admin-credentials
        - name: idp-admin-credentials-tenant-b
          secret:
            secretName: idp-admin-credentials-tenant-b
