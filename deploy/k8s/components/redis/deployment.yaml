apiVersion: apps/v1
kind: Deployment
metadata:
  name: redis
spec:
  # One replica, and no persistence. A second replica would be a second
  # answer to "who holds the lock", which is worse than no redundancy; and a
  # lease that survived a restart would be a lease held by a process that no
  # longer exists.
  replicas: 1
  strategy:
    # Never two Redis instances at once during a rollout: the new one would
    # start with no keys and hand out an election the old one still holds.
    type: Recreate
  selector:
    matchLabels:
      app: redis
  template:
    metadata:
      labels:
        app: redis
    spec:
      containers:
        - name: redis
          image: docker.io/library/redis:7-alpine
          args: ["--save", "", "--appendonly", "no"]
          ports:
            - name: redis
              containerPort: 6379
          readinessProbe:
            exec:
              command: ["redis-cli", "ping"]
            initialDelaySeconds: 2
            periodSeconds: 5
            failureThreshold: 10
          livenessProbe:
            exec:
              command: ["redis-cli", "ping"]
            initialDelaySeconds: 10
            periodSeconds: 10
            failureThreshold: 6
          resources:
            requests:
              cpu: 50m
              memory: 32Mi
            limits:
              cpu: 200m
              memory: 128Mi
