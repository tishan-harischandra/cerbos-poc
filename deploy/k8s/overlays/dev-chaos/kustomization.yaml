# The dev overlay plus the policy-release component (issue #26): this is
# the exact topology scripts/chaos deploys into kind, since two of the §18
# failure-table rows (Gitea outage, partial root rollout) need Gitea and the
# policy controller running, and those stay out of the plain dev overlay
# (see deploy/k8s/base/kustomization.yaml).
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: cerbos-poc-dev
resources:
  - ../dev
components:
  - ../../components/policy-release
images:
  - name: cerbos-poc/policy-controller
    newTag: dev
patches:
  # dev's own single replica per service (deploy/k8s/overlays/dev's own
  # replica patches) makes the §18 "kill a Cerbos/ADS pod, no failed
  # requests" rows untestable by construction: with one replica there is
  # nothing left to route to (confirmed against a live kind cluster, issue
  # #26 - killing the sole cerbos pod failed most in-flight decisions).
  # cerbos and ads get a second replica here, still far short of prod's
  # floor, so 01-cerbos-pod-failure.sh and 02-ads-pod-failure.sh have a
  # real second replica to fail over to.
  - target:
      kind: Deployment
      name: cerbos
    patch: |
      - op: replace
        path: /spec/replicas
        value: 2
  - target:
      kind: Deployment
      name: ads
    patch: |
      - op: replace
        path: /spec/replicas
        value: 2
  # KEDA's HPA would otherwise scale straight back down to dev's
  # minReplicaCount of 1 on its next reconcile, undoing the two patches
  # above.
  - target:
      kind: ScaledObject
      name: cerbos
    patch: |
      - op: replace
        path: /spec/minReplicaCount
        value: 2
  - target:
      kind: ScaledObject
      name: ads
    patch: |
      - op: replace
        path: /spec/minReplicaCount
        value: 2
  # 08-node-drain.sh drains whichever worker node happens to host a cerbos
  # pod, on the assumption that only cerbos and ads are ever at risk of
  # eviction (issue #26, §18: "Drain a node running Cerbos or ADS pods").
  # Without this pin, the scheduler is free to co-locate postgres, redpanda,
  # keycloak, gitea or admin-console on that same worker, and draining it
  # evicts them too - taking down the persistent port-forwards every
  # scenario after 08 depends on (confirmed against a live cluster: the run
  # that motivated this pin broke the keycloak port-forward mid-suite,
  # cascading into 09 and 10 failing on an unrelated "can't mint a token").
  # Pinning them to the control-plane node, which 08 never drains, keeps
  # them out of the blast radius entirely.
  - target:
      kind: StatefulSet
      name: postgres
    patch: |
      - op: add
        path: /spec/template/spec/nodeSelector
        value:
          node-role.kubernetes.io/control-plane: ""
      - op: add
        path: /spec/template/spec/tolerations
        value:
          - key: node-role.kubernetes.io/control-plane
            operator: Exists
            effect: NoSchedule
  - target:
      kind: StatefulSet
      name: redpanda
    patch: |
      - op: add
        path: /spec/template/spec/nodeSelector
        value:
          node-role.kubernetes.io/control-plane: ""
      - op: add
        path: /spec/template/spec/tolerations
        value:
          - key: node-role.kubernetes.io/control-plane
            operator: Exists
            effect: NoSchedule
  - target:
      kind: Deployment
      name: keycloak
    patch: |
      - op: add
        path: /spec/template/spec/nodeSelector
        value:
          node-role.kubernetes.io/control-plane: ""
      - op: add
        path: /spec/template/spec/tolerations
        value:
          - key: node-role.kubernetes.io/control-plane
            operator: Exists
            effect: NoSchedule
  - target:
      kind: Deployment
      name: gitea
    patch: |
      - op: add
        path: /spec/template/spec/nodeSelector
        value:
          node-role.kubernetes.io/control-plane: ""
      - op: add
        path: /spec/template/spec/tolerations
        value:
          - key: node-role.kubernetes.io/control-plane
            operator: Exists
            effect: NoSchedule
  - target:
      kind: Deployment
      name: admin-console
    patch: |
      - op: add
        path: /spec/template/spec/nodeSelector
        value:
          node-role.kubernetes.io/control-plane: ""
      - op: add
        path: /spec/template/spec/tolerations
        value:
          - key: node-role.kubernetes.io/control-plane
            operator: Exists
            effect: NoSchedule
