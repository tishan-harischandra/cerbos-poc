databaseChangeLog:
  - changeSet:
      id: 005-permission-revision
      author: cerbos-poc
      comment: >-
        The per-tenant permission revision every matrix save advances, and which
        the ADS reports alongside each decision.
      changes:
        - createTable:
            tableName: permission_revision
            columns:
              - column:
                  name: tenant_id
                  type: VARCHAR(64)
                  constraints:
                    primaryKey: true
                    primaryKeyName: pk_permission_revision
                    nullable: false
              - column:
                  name: revision
                  type: BIGINT
                  constraints:
                    nullable: false
              - column:
                  name: changed_at
                  type: TIMESTAMP WITH TIME ZONE
                  constraints:
                    nullable: false

  - changeSet:
      id: 005-permission-audit-event
      author: cerbos-poc
      comment: >-
        Append-only change history (§8.2). Nothing updates or deletes here, so
        the current assignment row can be updated in place while its history
        survives.
      changes:
        - createTable:
            tableName: permission_audit_event
            columns:
              - column:
                  name: event_id
                  type: VARCHAR(64)
                  constraints:
                    primaryKey: true
                    primaryKeyName: pk_permission_audit_event
                    nullable: false
              - column:
                  name: actor_id
                  type: VARCHAR(128)
                  constraints:
                    nullable: false
              - column:
                  name: operation
                  type: VARCHAR(32)
                  constraints:
                    nullable: false
              - column:
                  name: target_type
                  type: VARCHAR(64)
                  constraints:
                    nullable: false
              # before_json and after_json: two of the four JSON-bearing columns.
              - column:
                  name: before_json
                  type: CLOB
              - column:
                  name: after_json
                  type: CLOB
              - column:
                  name: tenant_id
                  type: VARCHAR(64)
                  constraints:
                    nullable: false
              - column:
                  name: hospital_id
                  type: VARCHAR(64)
              - column:
                  name: correlation_id
                  type: VARCHAR(128)
              - column:
                  name: created_at
                  type: TIMESTAMP WITH TIME ZONE
                  constraints:
                    nullable: false
        - createIndex:
            tableName: permission_audit_event
            indexName: ix_audit_tenant_created
            columns:
              - column:
                  name: tenant_id
              - column:
                  name: created_at

  - changeSet:
      id: 005-outbox-event
      author: cerbos-poc
      comment: >-
        The transactional outbox. published_at is genuinely absent until the
        event is published, which is the one place a NULL is the right answer.
      changes:
        - createTable:
            tableName: outbox_event
            columns:
              - column:
                  name: event_id
                  type: VARCHAR(64)
                  constraints:
                    primaryKey: true
                    primaryKeyName: pk_outbox_event
                    nullable: false
              - column:
                  name: aggregate_key
                  type: VARCHAR(256)
                  constraints:
                    nullable: false
              - column:
                  name: event_type
                  type: VARCHAR(64)
                  constraints:
                    nullable: false
              - column:
                  name: payload
                  type: CLOB
              - column:
                  name: created_at
                  type: TIMESTAMP WITH TIME ZONE
                  constraints:
                    nullable: false
              - column:
                  name: published_at
                  type: TIMESTAMP WITH TIME ZONE
        - createIndex:
            tableName: outbox_event
            indexName: ix_outbox_unpublished
            columns:
              - column:
                  name: published_at
              - column:
                  name: created_at
