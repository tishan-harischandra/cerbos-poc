# Format 2.4 is the highest version understood by both Compose v1 (still the
# default provider on some Linux distributions and under Podman) and Compose
# v2. Format 3.x silently drops `depends_on.condition`, which this topology
# relies on. The project name comes from COMPOSE_PROJECT_NAME in .env.
version: "2.4"

services:
  postgres:
    image: docker.io/library/postgres:16-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-cerbos_poc}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-change-me}
      POSTGRES_DB: ${POSTGRES_DB:-cerbos_poc}
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-cerbos_poc} -d ${POSTGRES_DB:-cerbos_poc}"]
      interval: 5s
      timeout: 5s
      retries: 20

  # Oracle is a portability target, not part of the running stack: the dual
  # dialect suite starts it deliberately and nothing else depends on it. It sits
  # behind a profile because the image is large and slow to start, and paying
  # that on every `make up` would make the default path unusable.
  #
  # gvenzl/oracle-free packages Oracle Database 23ai Free with a much smaller
  # footprint than the vendor image and creates an application user from the
  # environment, which the vendor image leaves to a setup script.
  oracle:
    image: docker.io/gvenzl/oracle-free:23-slim
    profiles:
      - oracle
    environment:
      ORACLE_PASSWORD: ${ORACLE_SYS_PASSWORD:-change-me}
      APP_USER: ${ORACLE_USER:-cerbos_poc}
      APP_USER_PASSWORD: ${ORACLE_PASSWORD:-change-me}
    # Deliberately no volume: the image ships FREEPDB1 already created, so every
    # start uses it and comes up in seconds. Persisting the data directory would
    # trade that for a minutes-long first boot, and this engine holds nothing
    # worth keeping between runs - the dual-dialect suite migrates it from
    # scratch each time.
    healthcheck:
      test: ["CMD", "healthcheck.sh"]
      interval: 10s
      timeout: 10s
      retries: 30
      start_period: 20s

  cerbos:
    image: ghcr.io/cerbos/cerbos:0.46.0
    command: ["server", "--config=/conf/config.yaml"]
    volumes:
      - ./deploy/cerbos/config.yaml:/conf/config.yaml:ro
      - ./deploy/cerbos/policies:/policies:ro
    healthcheck:
      test: ["CMD", "/cerbos", "healthcheck", "--config=/conf/config.yaml"]
      interval: 5s
      timeout: 5s
      retries: 20

  # Keycloak is the only service a browser authenticates against, so unlike the
  # PDP and the database it is published to the host: an OIDC redirect the user
  # cannot reach is not a login. Hostname and port are pinned so the issuer in a
  # token is the same string whether it was minted for the browser or read by
  # the ADS - a mismatch there rejects every token with a confusing message.
  keycloak:
    image: quay.io/keycloak/keycloak:26.4
    command: ["start-dev", "--import-realm"]
    environment:
      KC_BOOTSTRAP_ADMIN_USERNAME: ${KEYCLOAK_ADMIN:-admin}
      KC_BOOTSTRAP_ADMIN_PASSWORD: ${KEYCLOAK_ADMIN_PASSWORD:-change-me}
      KC_HTTP_ENABLED: "true"
      KC_HTTP_PORT: "8080"
      KC_HOSTNAME: ${KEYCLOAK_HOSTNAME:-http://localhost:8081}
      KC_HOSTNAME_BACKCHANNEL_DYNAMIC: "true"
      KC_HEALTH_ENABLED: "true"
    volumes:
      - ./deploy/keycloak/realm-cerbos-poc.json:/opt/keycloak/data/import/realm-cerbos-poc.json:ro
      - ./deploy/keycloak/realm-other-issuer.json:/opt/keycloak/data/import/realm-other-issuer.json:ro
    ports:
      - "${KEYCLOAK_PORT:-8081}:8080"
    # The image ships no curl or wget, so readiness is probed over bash's own
    # /dev/tcp against the management port health endpoint.
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "exec 3<>/dev/tcp/127.0.0.1/9000 && printf 'GET /health/ready HTTP/1.1\\r\\nHost: localhost\\r\\nConnection: close\\r\\n\\r\\n' >&3 && grep -q '\"status\": \"UP\"' <&3",
        ]
      interval: 5s
      timeout: 5s
      retries: 40
      start_period: 20s

  ads:
    build:
      context: .
      dockerfile: apps/ads/Dockerfile
    environment:
      ADS_HTTP_ADDR: ":8080"
      CERBOS_GRPC_ADDR: "cerbos:3593"
      # The readiness probe dials the address; the decision path connects with
      # the DSN. They are separate so a readiness probe never needs a credential.
      POSTGRES_ADDR: "postgres:5432"
      ASSIGNMENTSTORE_POSTGRES_DSN: "postgres://${POSTGRES_USER:-cerbos_poc}:${POSTGRES_PASSWORD:-change-me}@postgres:5432/${POSTGRES_DB:-cerbos_poc}?sslmode=disable"
      ADS_ROLE_MATRIX_CACHE_TTL: "${ADS_ROLE_MATRIX_CACHE_TTL:-30s}"
      # §7.1's installation selection, in full. Changing IDP_TYPE to WSO2_IS
      # selects the other adapter with no image rebuilt.
      IDP_TYPE: "${IDP_TYPE:-KEYCLOAK}"
      IDP_BASE_URL: "http://keycloak:8080"
      IDP_ADDR: "keycloak:8080"
      IDP_REALM: "${IDP_REALM:-cerbos-poc}"
      IDP_TENANT_ID: "${IDP_TENANT_ID:-tenant-a}"
      IDP_TENANT_MAPPING_MODE: "${IDP_TENANT_MAPPING_MODE:-CLAIM}"
      IDP_ROLE_SOURCE: "${IDP_ROLE_SOURCE:-CLIENT}"
      IDP_CLIENT_ID: "${IDP_CLIENT_ID:-patient-app}"
      IDP_SERVICE_CLIENT_ID: "${IDP_SERVICE_CLIENT_ID:-authorization-admin-service}"
      # The issuer is what the browser's token claims, so it is the published
      # address rather than the compose-internal one.
      IDP_ISSUER: "${KEYCLOAK_HOSTNAME:-http://localhost:8081}/realms/${IDP_REALM:-cerbos-poc}"
      # By reference, never by value: a secret in an environment variable is
      # visible in `docker inspect` and inherited by every child process.
      IDP_CREDENTIALS_SECRET_REF: "/run/secrets/idp-admin-credentials"
    volumes:
      - ./deploy/secrets/idp-admin-credentials:/run/secrets/idp-admin-credentials:ro
    depends_on:
      cerbos:
        condition: service_healthy
      postgres:
        condition: service_healthy
      keycloak:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--tries=1", "--spider", "http://127.0.0.1:8080/readyz"]
      interval: 5s
      timeout: 5s
      retries: 20

  admin-console:
    build:
      context: .
      dockerfile: apps/admin-console/Dockerfile
    ports:
      - "${ADMIN_CONSOLE_PORT:-4200}:80"
    depends_on:
      ads:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--tries=1", "--spider", "http://127.0.0.1/index.html"]
      interval: 5s
      timeout: 5s
      retries: 20

volumes:
  postgres-data:
