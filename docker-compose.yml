# Format 2.4 is the highest version understood by both Compose v1 (still the
# default provider on some Linux distributions and under Podman) and Compose
# v2. Format 3.x silently drops `depends_on.condition`, which this topology
# relies on. The project name comes from COMPOSE_PROJECT_NAME in .env.
version: "2.4"

services:
  postgres:
    image: docker.io/library/postgres:16-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-cerbos_poc}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-change-me}
      POSTGRES_DB: ${POSTGRES_DB:-cerbos_poc}
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-cerbos_poc} -d ${POSTGRES_DB:-cerbos_poc}"]
      interval: 5s
      timeout: 5s
      retries: 20

  # Oracle is a portability target, not part of the running stack: the dual
  # dialect suite starts it deliberately and nothing else depends on it. It sits
  # behind a profile because the image is large and slow to start, and paying
  # that on every `make up` would make the default path unusable.
  #
  # gvenzl/oracle-free packages Oracle Database 23ai Free with a much smaller
  # footprint than the vendor image and creates an application user from the
  # environment, which the vendor image leaves to a setup script.
  oracle:
    image: docker.io/gvenzl/oracle-free:23-slim
    profiles:
      - oracle
    environment:
      ORACLE_PASSWORD: ${ORACLE_SYS_PASSWORD:-change-me}
      APP_USER: ${ORACLE_USER:-cerbos_poc}
      APP_USER_PASSWORD: ${ORACLE_PASSWORD:-change-me}
    # Deliberately no volume: the image ships FREEPDB1 already created, so every
    # start uses it and comes up in seconds. Persisting the data directory would
    # trade that for a minutes-long first boot, and this engine holds nothing
    # worth keeping between runs - the dual-dialect suite migrates it from
    # scratch each time.
    healthcheck:
      test: ["CMD", "healthcheck.sh"]
      interval: 10s
      timeout: 10s
      retries: 30
      start_period: 20s

  # Redis is optional in exactly the way Oracle is: nothing in this stack
  # needs it, and it exists so an installation that already runs Redis can
  # point LEADER_ELECTION_TYPE=REDIS at it (ADR-009). Behind a profile so the
  # default path does not start a service no default configuration uses.
  redis:
    image: docker.io/library/redis:7-alpine
    profiles:
      - redis
    # No volume: a lease that survived a restart would be a lease held by a
    # process that no longer exists, so forgetting everything on restart is
    # the behaviour this wants rather than a limitation.
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 20

  cerbos:
    image: ghcr.io/cerbos/cerbos:0.46.0
    command: ["server", "--config=/conf/config.yaml"]
    volumes:
      - ./deploy/cerbos/config.yaml:/conf/config.yaml:ro
      - ./deploy/cerbos/policies:/policies:ro
    healthcheck:
      test: ["CMD", "/cerbos", "healthcheck", "--config=/conf/config.yaml"]
      interval: 5s
      timeout: 5s
      retries: 20

  # Keycloak is the only service a browser authenticates against, so unlike the
  # PDP and the database it is published to the host: an OIDC redirect the user
  # cannot reach is not a login. Hostname and port are pinned so the issuer in a
  # token is the same string whether it was minted for the browser or read by
  # the ADS - a mismatch there rejects every token with a confusing message.
  keycloak:
    image: quay.io/keycloak/keycloak:26.4
    # `organization` is a preview feature in 26.4: Keycloak Organizations
    # (issue #75/#74) is disabled by default and every organization-scoped
    # token request 400s without it. Enabling it here is required, not
    # optional, once any realm fixture declares "organizationsEnabled".
    command: ["start-dev", "--import-realm", "--features=organization"]
    environment:
      KC_BOOTSTRAP_ADMIN_USERNAME: ${KEYCLOAK_ADMIN:-admin}
      KC_BOOTSTRAP_ADMIN_PASSWORD: ${KEYCLOAK_ADMIN_PASSWORD:-change-me}
      KC_HTTP_ENABLED: "true"
      KC_HTTP_PORT: "8080"
      KC_HOSTNAME: ${KEYCLOAK_HOSTNAME:-http://localhost:8081}
      KC_HOSTNAME_BACKCHANNEL_DYNAMIC: "true"
      KC_HEALTH_ENABLED: "true"
    volumes:
      - ./deploy/keycloak/realm-cerbos-poc.json:/opt/keycloak/data/import/realm-cerbos-poc.json:ro
      - ./deploy/keycloak/realm-other-issuer.json:/opt/keycloak/data/import/realm-other-issuer.json:ro
    ports:
      - "${KEYCLOAK_PORT:-8081}:8080"
    # The image ships no curl or wget, so readiness is probed over bash's own
    # /dev/tcp against the management port health endpoint.
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "exec 3<>/dev/tcp/127.0.0.1/9000 && printf 'GET /health/ready HTTP/1.1\\r\\nHost: localhost\\r\\nConnection: close\\r\\n\\r\\n' >&3 && grep -q '\"status\": \"UP\"' <&3",
        ]
      interval: 5s
      timeout: 5s
      retries: 40
      start_period: 20s

  # The load-test population (issue #24) is bulk-loaded by writing directly to
  # Keycloak's internal schema (§15, load model) - the only way to reach
  # 600,000 users / 42,000,000 role mappings in a documented, bounded time.
  # That requires a real, addressable database behind Keycloak; the default
  # `keycloak` service above deliberately keeps its ephemeral start-dev store
  # because the demo profile never needs more than a handful of fixture users.
  # This pair is therefore isolated behind the `loadtest` profile so the
  # default stack, and every existing e2e/smoke test against it, is
  # unaffected.
  keycloak-db:
    image: docker.io/library/postgres:16-alpine
    profiles:
      - loadtest
    environment:
      POSTGRES_USER: ${KEYCLOAK_DB_USER:-keycloak}
      POSTGRES_PASSWORD: ${KEYCLOAK_DB_PASSWORD:-change-me}
      POSTGRES_DB: ${KEYCLOAK_DB_NAME:-keycloak}
    volumes:
      - keycloak-loadtest-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${KEYCLOAK_DB_USER:-keycloak} -d ${KEYCLOAK_DB_NAME:-keycloak}"]
      interval: 5s
      timeout: 5s
      retries: 20

  # A second Keycloak, pinned to the same 26.4 image as the demo instance
  # (libs/keycloakbulkload's direct-SQL writer is version-pinned to this exact
  # schema) but backed by keycloak-db instead of dev-mode's file store, and
  # published on a different port so both can run side by side.
  keycloak-loadtest:
    image: quay.io/keycloak/keycloak:26.4
    profiles:
      - loadtest
    command: ["start-dev"]
    environment:
      KC_BOOTSTRAP_ADMIN_USERNAME: ${KEYCLOAK_ADMIN:-admin}
      KC_BOOTSTRAP_ADMIN_PASSWORD: ${KEYCLOAK_ADMIN_PASSWORD:-change-me}
      KC_HTTP_ENABLED: "true"
      KC_HTTP_PORT: "8080"
      KC_HOSTNAME: ${KEYCLOAK_LOADTEST_HOSTNAME:-http://localhost:8083}
      KC_HOSTNAME_BACKCHANNEL_DYNAMIC: "true"
      KC_HEALTH_ENABLED: "true"
      KC_DB: postgres
      KC_DB_URL: jdbc:postgresql://keycloak-db:5432/${KEYCLOAK_DB_NAME:-keycloak}
      KC_DB_USERNAME: ${KEYCLOAK_DB_USER:-keycloak}
      KC_DB_PASSWORD: ${KEYCLOAK_DB_PASSWORD:-change-me}
    depends_on:
      keycloak-db:
        condition: service_healthy
    ports:
      - "${KEYCLOAK_LOADTEST_PORT:-8083}:8080"
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "exec 3<>/dev/tcp/127.0.0.1/9000 && printf 'GET /health/ready HTTP/1.1\\r\\nHost: localhost\\r\\nConnection: close\\r\\n\\r\\n' >&3 && grep -q '\"status\": \"UP\"' <&3",
        ]
      interval: 5s
      timeout: 5s
      retries: 40
      start_period: 20s

  # Kafka-compatible compose service for the outbox-to-invalidation transport
  # (§10). Single-node, dev-mode configuration: this is the transport for a
  # targeted cache invalidation, never the source of truth, so nothing here
  # needs the durability or replication a production cluster would.
  redpanda:
    image: docker.io/redpandadata/redpanda:v24.2.7
    command:
      - redpanda
      - start
      - --smp=1
      - --memory=512M
      - --overprovisioned
      - --node-id=0
      - --kafka-addr=PLAINTEXT://0.0.0.0:9092
      - --advertise-kafka-addr=PLAINTEXT://redpanda:9092
      - --check=false
      # Redpanda reports anonymous usage stats to Redpanda Data by default;
      # this is an invalidation transport internal to the compose network,
      # not a deployment with a Redpanda support relationship. This must
      # be two array entries: v24.2.7's rpk forwards '--set' straight to
      # the redpanda binary's own parser, which rejects the '--set=key=value'
      # single-token form.
      - --set
      - enable_usage_stats=false
    healthcheck:
      test: ["CMD", "rpk", "cluster", "health", "--exit-when-healthy"]
      interval: 5s
      timeout: 5s
      retries: 30

  ads:
    build:
      context: .
      dockerfile: apps/ads/Dockerfile
    environment:
      ADS_HTTP_ADDR: ":8080"
      CERBOS_GRPC_ADDR: "cerbos:3593"
      # The readiness probe dials the address; the decision path connects with
      # the DSN. They are separate so a readiness probe never needs a credential.
      POSTGRES_ADDR: "postgres:5432"
      ASSIGNMENTSTORE_POSTGRES_DSN: "postgres://${POSTGRES_USER:-cerbos_poc}:${POSTGRES_PASSWORD:-change-me}@postgres:5432/${POSTGRES_DB:-cerbos_poc}?sslmode=disable"
      ADS_ROLE_MATRIX_CACHE_TTL: "${ADS_ROLE_MATRIX_CACHE_TTL:-30s}"
      # §10: the consumer side of the outbox-to-Kafka invalidation path, plus
      # the revision reconciler that repairs whatever it misses.
      KAFKA_BROKERS: "redpanda:9092"
      KAFKA_PERMISSION_CHANGED_TOPIC: "${KAFKA_PERMISSION_CHANGED_TOPIC:-permission-changed}"
      KAFKA_CONSUMER_GROUP: "ads"
      ADS_RECONCILE_INTERVAL: "${ADS_RECONCILE_INTERVAL:-2s}"
      # §7.1's installation selection, in full. Changing IDP_TYPE to WSO2_IS
      # selects the other adapter with no image rebuilt.
      IDP_TYPE: "${IDP_TYPE:-KEYCLOAK}"
      IDP_BASE_URL: "http://keycloak:8080"
      IDP_ADDR: "keycloak:8080"
      IDP_REALM: "${IDP_REALM:-cerbos-poc}"
      IDP_TENANT_ID: "${IDP_TENANT_ID:-tenant-a}"
      IDP_TENANT_MAPPING_MODE: "${IDP_TENANT_MAPPING_MODE:-CLAIM}"
      IDP_ROLE_SOURCE: "${IDP_ROLE_SOURCE:-CLIENT}"
      IDP_CLIENT_ID: "${IDP_CLIENT_ID:-patient-app}"
      IDP_SERVICE_CLIENT_ID: "${IDP_SERVICE_CLIENT_ID:-authorization-admin-service}"
      # The issuer is what the browser's token claims, so it is the published
      # address rather than the compose-internal one.
      IDP_ISSUER: "${KEYCLOAK_HOSTNAME:-http://localhost:8081}/realms/${IDP_REALM:-cerbos-poc}"
      # By reference, never by value: a secret in an environment variable is
      # visible in `docker inspect` and inherited by every child process.
      IDP_CREDENTIALS_SECRET_REF: "/run/secrets/idp-admin-credentials"
      # The capability snapshot endpoint (§12.3, issue #11) reads the same
      # committed capability catalog Cerbos itself reads its policies from.
      CAPABILITY_CATALOG_DIR: "/capability-catalog"
      CAPABILITY_CATALOG_REVISION: "${CAPABILITY_CATALOG_REVISION:-1}"
      ROOT_POLICY_REVISION: "${ROOT_POLICY_REVISION:-root-v1.4.0}"
    volumes:
      - ./deploy/secrets/idp-admin-credentials:/run/secrets/idp-admin-credentials:ro
      - ./deploy/cerbos/catalog/ui-capabilities:/capability-catalog:ro
    depends_on:
      cerbos:
        condition: service_healthy
      postgres:
        condition: service_healthy
      keycloak:
        condition: service_healthy
      redpanda:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--tries=1", "--spider", "http://127.0.0.1:8080/readyz"]
      interval: 5s
      timeout: 5s
      retries: 20

  # The write path for role permissions (§9.4, issue #13). Publishes every
  # committed change to Kafka (§10.1's step 5) so the ADS replicas above can
  # invalidate their caches; the write itself never depends on Kafka being up.
  admin-service:
    build:
      context: .
      dockerfile: apps/admin-service/Dockerfile
    environment:
      ADMIN_SERVICE_HTTP_ADDR: ":8081"
      POSTGRES_ADDR: "postgres:5432"
      ASSIGNMENTSTORE_POSTGRES_DSN: "postgres://${POSTGRES_USER:-cerbos_poc}:${POSTGRES_PASSWORD:-change-me}@postgres:5432/${POSTGRES_DB:-cerbos_poc}?sslmode=disable"
      IDP_TYPE: "${IDP_TYPE:-KEYCLOAK}"
      IDP_BASE_URL: "http://keycloak:8080"
      IDP_ADDR: "keycloak:8080"
      IDP_REALM: "${IDP_REALM:-cerbos-poc}"
      IDP_TENANT_ID: "${IDP_TENANT_ID:-tenant-a}"
      IDP_TENANT_MAPPING_MODE: "${IDP_TENANT_MAPPING_MODE:-CLAIM}"
      IDP_ROLE_SOURCE: "${IDP_ROLE_SOURCE:-CLIENT}"
      IDP_CLIENT_ID: "${IDP_CLIENT_ID:-patient-app}"
      IDP_SERVICE_CLIENT_ID: "${IDP_SERVICE_CLIENT_ID:-authorization-admin-service}"
      IDP_ISSUER: "${KEYCLOAK_HOSTNAME:-http://localhost:8081}/realms/${IDP_REALM:-cerbos-poc}"
      IDP_CREDENTIALS_SECRET_REF: "/run/secrets/idp-admin-credentials"
      AUTHORIZATION_CATALOG_DIR: "/authorization-catalog"
      # The capability impact endpoint (§9.1, issue #18) reads the same
      # committed capability catalog Cerbos and the ADS's own capability
      # snapshot endpoint read theirs from.
      CAPABILITY_CATALOG_DIR: "/capability-catalog"
      KAFKA_BROKERS: "redpanda:9092"
      KAFKA_PERMISSION_CHANGED_TOPIC: "${KAFKA_PERMISSION_CHANGED_TOPIC:-permission-changed}"
      # Only the leader drains the outbox (ADR-009). PG_ADVISORY is the
      # default here because compose runs PostgreSQL and it is the one
      # type with no split-brain window; an installation on the oracle
      # profile sets DATABASE instead. There is no default in the code:
      # an unset value refuses to start rather than silently electing
      # every replica.
      LEADER_ELECTION_TYPE: "${LEADER_ELECTION_TYPE:-PG_ADVISORY}"
      LEADER_ELECTION_REDIS_ADDR: "${LEADER_ELECTION_REDIS_ADDR:-redis:6379}"
      # This service serves the Admin Console (ADR-008), so the console's
      # login configuration is now its own. The issuer is the published
      # address the browser is redirected to, not the compose-internal one.
      OIDC_ISSUER: "${KEYCLOAK_HOSTNAME:-http://localhost:8081}/realms/${IDP_REALM:-cerbos-poc}"
      OIDC_CLIENT_ID: "${IDP_CLIENT_ID:-patient-app}"
      # §9.3: high-risk actions default to a bounded expiry when a GRANT or
      # REVOKE names none, rather than being left unbounded (issue #15).
      USER_OVERRIDE_HIGH_RISK_ACTIONS: "${USER_OVERRIDE_HIGH_RISK_ACTIONS:-update,delete,assign}"
      USER_OVERRIDE_HIGH_RISK_VALIDITY: "${USER_OVERRIDE_HIGH_RISK_VALIDITY:-2160h}"
      # The effective-access simulator (§9.4, issue #19) runs the real ADS
      # and Cerbos path for an explicitly named principal, never a second
      # evaluation implementation of its own.
      ADS_ADDR: "http://ads:8080"
      # The revision and activation module (§9.1, issue #22) reads the
      # policy controller's release history from this shared volume. It is
      # empty unless the policy-release profile's controller (issue #21)
      # has actually run, in which case the module simply reports no
      # current revision and no history - never an error.
      POLICY_ARCHIVE_STORE_DIR: "/var/lib/policy-controller/archives"
    volumes:
      - ./deploy/secrets/idp-admin-credentials:/run/secrets/idp-admin-credentials:ro
      - ./deploy/cerbos/catalog/resources:/authorization-catalog:ro
      - ./deploy/cerbos/catalog/ui-capabilities:/capability-catalog:ro
      - policy-release-archives:/var/lib/policy-controller/archives:ro
    # The only published port on the control plane, and the Admin Console's
    # address (ADR-008). Everything behind it - the ADS, the PDP, the
    # database - stays on the internal network (§16.1).
    ports:
      - "${ADMIN_CONSOLE_PORT:-4200}:8081"
    depends_on:
      postgres:
        condition: service_healthy
      keycloak:
        condition: service_healthy
      redpanda:
        condition: service_healthy
      ads:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--tries=1", "--spider", "http://127.0.0.1:8081/readyz"]
      interval: 5s
      timeout: 5s
      retries: 20

  # The generic FHIR resource service: the policy enforcement point in front
  # of fhir_resource (issue #9). It holds resource instances and asks the
  # ADS's decision endpoint before acting; it never calls the Cerbos PDP
  # directly, and it never trusts an attribute from a request body.
  resource-service:
    build:
      context: .
      dockerfile: apps/resource-service/Dockerfile
    environment:
      RESOURCE_SERVICE_HTTP_ADDR: ":8080"
      ADS_ADDR: "http://ads:8080"
      POSTGRES_ADDR: "postgres:5432"
      ASSIGNMENTSTORE_POSTGRES_DSN: "postgres://${POSTGRES_USER:-cerbos_poc}:${POSTGRES_PASSWORD:-change-me}@postgres:5432/${POSTGRES_DB:-cerbos_poc}?sslmode=disable"
      IDP_TYPE: "${IDP_TYPE:-KEYCLOAK}"
      IDP_BASE_URL: "http://keycloak:8080"
      IDP_ADDR: "keycloak:8080"
      IDP_REALM: "${IDP_REALM:-cerbos-poc}"
      IDP_TENANT_ID: "${IDP_TENANT_ID:-tenant-a}"
      IDP_TENANT_MAPPING_MODE: "${IDP_TENANT_MAPPING_MODE:-CLAIM}"
      IDP_ROLE_SOURCE: "${IDP_ROLE_SOURCE:-CLIENT}"
      IDP_CLIENT_ID: "${IDP_CLIENT_ID:-patient-app}"
      IDP_SERVICE_CLIENT_ID: "${IDP_SERVICE_CLIENT_ID:-authorization-admin-service}"
      IDP_ISSUER: "${KEYCLOAK_HOSTNAME:-http://localhost:8081}/realms/${IDP_REALM:-cerbos-poc}"
      IDP_CREDENTIALS_SECRET_REF: "/run/secrets/idp-admin-credentials"
    volumes:
      - ./deploy/secrets/idp-admin-credentials:/run/secrets/idp-admin-credentials:ro
    depends_on:
      ads:
        condition: service_healthy
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--tries=1", "--spider", "http://127.0.0.1:8080/readyz"]
      interval: 5s
      timeout: 5s
      retries: 20

  # Everything below is issue #21's policy sync and release pipeline. It sits
  # behind the policy-release profile and runs its own Gitea, its own Cerbos
  # instance and its own policy volume, entirely separate from the `cerbos`
  # service and the committed deploy/cerbos/policies bind mount every other
  # service above still serves from. That keeps the default `docker compose
  # up` walking skeleton exactly as it was; this profile is where the
  # controller's poll-validate-package-install-activate pipeline (§13) is
  # exercised end to end, starting from a real Gitea tag rather than a file
  # already sitting on disk.
  #
  # `make policy-release-seed` creates the root policy repository, pushes the
  # committed catalog+policies tree, tags it and protects the tag - run it
  # once after `docker compose --profile policy-release up -d gitea`.
  gitea:
    # 1.23 is the first release with the tag_protections REST API
    # (go-gitea/gitea#31295): before it, a tag's protected status could
    # only be read back from the settings UI, never the API GiteaClient
    # actually calls. Confirmed against a live 1.22 container, which 404s
    # on GET .../tag_protections.
    image: docker.io/gitea/gitea:1.23
    profiles:
      - policy-release
    environment:
      GITEA__security__INSTALL_LOCK: "true"
      GITEA__server__DOMAIN: gitea
      GITEA__server__ROOT_URL: "http://gitea:3000/"
      GITEA__database__DB_TYPE: sqlite3
      GITEA__actions__ENABLED: "false"
    volumes:
      - gitea-data:/data
    # Published so scripts/gitea-seed.sh can push the root policy tree and
    # protect its tag from the host with a plain git+curl, the same way
    # Keycloak's realm import needs no in-container tooling either. The
    # policy-controller container itself still reaches Gitea over the
    # internal compose network at http://gitea:3000.
    ports:
      - "${GITEA_PORT:-3001}:3000"
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--tries=1", "--spider", "http://127.0.0.1:3000/api/healthz"]
      interval: 5s
      timeout: 5s
      retries: 30
      start_period: 10s

  # Cerbos's disk store fails to start if storage.disk.directory doesn't
  # exist yet, but policy-release-store is a fresh empty volume until the
  # controller's atomic install ever runs. This one-shot init creates the
  # (empty) /policies/current directory on the shared volume before
  # cerbos-managed starts, so the very first controller install can still
  # rename its staged directory over it (§13.4 atomic install).
  policy-release-store-init:
    image: docker.io/library/alpine:3.20
    profiles:
      - policy-release
    # policy-controller runs as uid 10001 (see its Dockerfile) and needs to
    # create staging directories and rename them at the volume root during
    # atomic install (§13.4), not just inside /policies/current.
    command: ["sh", "-c", "mkdir -p /policies/current && chown -R 10001:10001 /policies"]
    volumes:
      - policy-release-store:/policies

  # A dedicated Cerbos instance so this profile never touches the default
  # `cerbos` service's bind-mounted policy tree: policy-release-store starts
  # empty and is filled only by the controller's atomic install.
  cerbos-managed:
    image: ghcr.io/cerbos/cerbos:0.46.0
    profiles:
      - policy-release
    command: ["server", "--config=/conf/config.yaml"]
    volumes:
      - ./deploy/cerbos/config-managed.yaml:/conf/config.yaml:ro
      - policy-release-store:/policies
    depends_on:
      policy-release-store-init:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD", "/cerbos", "healthcheck", "--config=/conf/config.yaml"]
      interval: 5s
      timeout: 5s
      retries: 20

  policy-controller:
    build:
      context: .
      dockerfile: apps/policy-controller/Dockerfile
    profiles:
      - policy-release
    environment:
      POLICY_CONTROLLER_HTTP_ADDR: ":8082"
      GITEA_BASE_URL: "http://gitea:3000"
      GITEA_REPO: "${POLICY_RELEASE_GITEA_REPO:-authz/root-policy}"
      GITEA_TOKEN: "${POLICY_RELEASE_GITEA_TOKEN:-}"
      ROOT_POLICY_TAG_PREFIX: "${ROOT_POLICY_TAG_PREFIX:-root-v}"
      # Leader election only: this DSN grants no access to assignment data,
      # and the controller never opens the assignmentstore port (§13.1).
      POSTGRES_DSN: "postgres://${POSTGRES_USER:-cerbos_poc}:${POSTGRES_PASSWORD:-change-me}@postgres:5432/${POSTGRES_DB:-cerbos_poc}?sslmode=disable"
      ASSIGNMENTSTORE_POSTGRES_DSN: "postgres://${POSTGRES_USER:-cerbos_poc}:${POSTGRES_PASSWORD:-change-me}@postgres:5432/${POSTGRES_DB:-cerbos_poc}?sslmode=disable"
      # Which mechanism decides the singleton is an operational choice
      # (ADR-009), and it is stated explicitly rather than defaulted.
      LEADER_ELECTION_TYPE: "${LEADER_ELECTION_TYPE:-PG_ADVISORY}"
      LEADER_ELECTION_REDIS_ADDR: "${LEADER_ELECTION_REDIS_ADDR:-redis:6379}"
      CERBOS_ADMIN_ADDRESSES: "cerbos-managed:3593"
      CERBOS_ADMIN_USERNAME: "cerbos"
      CERBOS_ADMIN_PASSWORD: "change-me"
      CERBOS_ADMIN_PLAINTEXT: "true"
      # /policies/current, not /policies itself - see
      # deploy/cerbos/config-managed.yaml's storage.disk.directory comment
      # for why the atomic install needs a subdirectory of the volume
      # mount, not the mount point.
      POLICY_DIR: "/policies/current"
      POLICY_ARCHIVE_STORE_DIR: "/var/lib/policy-controller/archives"
      POLICY_WORK_DIR: "/var/lib/policy-controller/work"
      POLICY_CONTROLLER_POLL_INTERVAL: "${POLICY_CONTROLLER_POLL_INTERVAL:-15s}"
      POLICY_CONTROLLER_RETAIN_COUNT: "${POLICY_CONTROLLER_RETAIN_COUNT:-5}"
    volumes:
      - policy-release-store:/policies
      - policy-release-archives:/var/lib/policy-controller/archives
    depends_on:
      gitea:
        condition: service_healthy
      postgres:
        condition: service_healthy
      cerbos-managed:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--tries=1", "--spider", "http://127.0.0.1:8082/readyz"]
      interval: 5s
      timeout: 5s
      retries: 20

  business-ui:
    build:
      context: .
      dockerfile: apps/business-ui/Dockerfile
    ports:
      - "${BUSINESS_UI_PORT:-4201}:80"
    depends_on:
      ads:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--tries=1", "--spider", "http://127.0.0.1/index.html"]
      interval: 5s
      timeout: 5s
      retries: 20

  # Prometheus and Grafana behind the `observability` profile (issue #23,
  # §17.1): scrapes the ADS's own metrics and Cerbos's built-in
  # /_cerbos/metrics endpoint, on the internal compose network only -
  # neither target is ever published to the host.
  prometheus:
    image: docker.io/prom/prometheus:v2.55.1
    profiles:
      - observability
    volumes:
      - ./deploy/observability/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus-data:/prometheus
    ports:
      - "${PROMETHEUS_PORT:-9090}:9090"
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--tries=1", "--spider", "http://127.0.0.1:9090/-/healthy"]
      interval: 5s
      timeout: 5s
      retries: 20

  grafana:
    image: docker.io/grafana/grafana:11.3.1
    profiles:
      - observability
    environment:
      # A fixed dev credential inside the operator's own compose network,
      # the same pattern as every other service's default password here
      # (§14.4: never exposed through ingress).
      GF_SECURITY_ADMIN_USER: "admin"
      GF_SECURITY_ADMIN_PASSWORD: "${GRAFANA_ADMIN_PASSWORD:-change-me}"
      GF_AUTH_ANONYMOUS_ENABLED: "false"
    volumes:
      - ./deploy/observability/grafana/provisioning:/etc/grafana/provisioning:ro
      - grafana-data:/var/lib/grafana
    ports:
      - "${GRAFANA_PORT:-3002}:3000"
    depends_on:
      prometheus:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--tries=1", "--spider", "http://127.0.0.1:3000/api/health"]
      interval: 5s
      timeout: 5s
      retries: 20

volumes:
  postgres-data:
  gitea-data:
  policy-release-store:
  policy-release-archives:
  prometheus-data:
  grafana-data:
  keycloak-loadtest-data:
