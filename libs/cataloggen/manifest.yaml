# The committed FHIR resource manifest (issue #8, §6.1, §8, §21).
#
# This is the single source of truth every downstream artifact is generated
# from: the resource-action catalog, the Cerbos policies, the JSON schemas,
# the Cerbos test suite and the database catalog seed. Nothing downstream is
# hand-edited; a change here and a re-run of `libs/cataloggen/cmd/cataloggen`
# is the only way the generated tree changes (see the golden-file test in
# generator_test.go and the drift check in tests/architecture).
#
# sourceNote records where this list came from and its limitations, per the
# PRD requirement that the manifest record why each entry is included or
# excluded (PRD "Resource and action catalog" story 14).
sourceNote: >-
  FHIR R6 is still in ballot and its final resource list is not yet fixed.
  With the user's explicit approval, this manifest uses the finalized FHIR R5
  concrete resource list as a stand-in, compiled from the model's training
  data rather than fetched from the live HL7 spec (the spec pages were too
  large to retrieve reliably with the available tooling). It has NOT been
  machine-verified against https://hl7.org/fhir/R5/resourcelist.html or the
  eventual R6 ballot text. Treat resource inclusion, naming and grouping as
  best-effort and subject to human review (this issue is labelled hitl for
  exactly that reason). Abstract types `Resource` and `DomainResource` are
  excluded by construction; they are not concrete resource kinds and cannot
  be the `resource` of a Cerbos resource policy.

catalogRevision: 1

# Every resource gets the same six actions (PRD story 11). `assign` transfers
# responsibility for a resource instance to a practitioner or team; it is
# authorized independently of `update` (§6, issue #8).
actions:
  - key: create
    displayName: Create
    context: COLLECTION
  - key: list
    displayName: List
    context: COLLECTION
  - key: read
    displayName: Read
    context: INSTANCE
  - key: update
    displayName: Update
    context: INSTANCE
  - key: delete
    displayName: Delete
    context: INSTANCE
  - key: assign
    displayName: Assign
    context: INSTANCE

# Actions denied by the shared mandatory `status == "LOCKED"` restriction
# (mirrors the ADR-006 pattern already proven by patient_record: §6.5,
# deploy/liquibase/changelog/tables/006-fhir-resource.yaml). `create` and
# `list` are collection-scoped and have no existing instance to lock.
lockableActions: [update, delete, assign]

resources:
  # Hand-authored ahead of the generator as the ADR-006 reference pattern
  # (deploy/cerbos/policies/resources/patient_record.yaml, issue #3). Excluded
  # from generation in this slice: patient_record only implements three of the
  # six actions and its own bespoke schema, and demoseed, the store contract,
  # resolver tests and scripts/tests/decision-e2e.sh are all built against
  # its exact shape. Regenerating it now would be a large, unrelated blast
  # radius for this issue. A follow-up can fold Patient into the generator
  # once the generated six-action shape has proven itself at catalog scale.
  - fhirType: Patient
    domain: administrative
    included: false
    reason: >-
      Already hand-authored as the ADR-006 reference pattern ahead of the
      generator; excluded here to avoid disrupting existing demo, store
      contract and end-to-end test wiring built against patient_record.

